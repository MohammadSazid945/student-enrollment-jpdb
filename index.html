<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment Management System | JsonPowerDB</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- JsonPowerDB Commons -->
    <script src="http://login2explore.com/jpdb/resources/js/0.0.3/jpdb-commons.js"></script>

    <!-- Project JavaScript -->
    <script src="js/script.js" defer></script>
</head>

<body>

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="#">
                <i class="fa-solid fa-graduation-cap fs-4"></i>
                <span>EduEnroll JPDB</span>
            </a>
            <span class="navbar-text text-white-50 fs-7 d-none d-sm-inline">
                Login2Xplore Micro Project
            </span>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container my-4 my-md-5">
        <div class="row justify-content-center">
            <div class="col-lg-9 col-xl-8">

                <!-- Title Card Header -->
                <div class="text-center mb-4">
                    <h1 class="fw-bold text-dark h2 mb-1">Student Enrollment Management System</h1>
                    <p class="text-muted fw-medium fs-6">Powered by <span
                            class="badge bg-primary-subtle text-primary border border-primary-subtle px-2 py-1 fs-7">JsonPowerDB
                            V2.0</span></p>
                </div>

                <!-- Status / Alert Message Container -->
                <div id="status-alert" class="alert alert-dismissible fade show d-none mb-4 shadow-sm" role="alert">
                    <span id="alert-message"></span>
                    <button type="button" class="btn-close" onclick="hideAlert()" aria-label="Close"></button>
                </div>

                <!-- Main Form Card -->
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div
                        class="card-header bg-white border-bottom py-3 px-4 d-flex justify-content-between align-items-center">
                        <h2 class="h5 mb-0 fw-semibold text-secondary d-flex align-items-center gap-2">
                            <i class="fa-solid fa-id-card text-primary"></i> Student Details
                        </h2>
                        <span id="form-mode-badge"
                            class="badge bg-secondary rounded-pill px-3 py-2 fs-7 fw-normal">Mode: Entry</span>
                    </div>

                    <div class="card-body p-4">
                        <form id="studentForm" autocomplete="off" onsubmit="return false;">

                            <!-- Roll Number Field (Primary key search trigger) -->
                            <div class="mb-3">
                                <label for="rollNo" class="form-label fw-medium">Roll Number <span
                                        class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i
                                            class="fa-solid fa-hashtag text-muted"></i></span>
                                    <input type="text" class="form-control form-control-lg" id="rollNo"
                                        placeholder="Enter Roll Number (e.g. 101)" onblur="checkRollNumber()">
                                </div>
                                <div class="form-text">Type Roll Number and press Tab or click outside to auto-lookup
                                    record.</div>
                            </div>

                            <!-- Full Name Field -->
                            <div class="mb-3">
                                <label for="name" class="form-label fw-medium">Full Name <span
                                        class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i
                                            class="fa-solid fa-user text-muted"></i></span>
                                    <input type="text" class="form-control" id="name" placeholder="Enter full name"
                                        disabled>
                                </div>
                            </div>

                            <!-- Course & Enrollment Date (2 Columns) -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="course" class="form-label fw-medium">Course <span
                                            class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i
                                                class="fa-solid fa-book-open text-muted"></i></span>
                                        <select class="form-select" id="course" disabled>
                                            <option value="" selected disabled>Select Course</option>
                                            <option value="BCA">BCA - Computer Applications</option>
                                            <option value="B.Tech CS">B.Tech - Computer Science</option>
                                            <option value="B.Tech IT">B.Tech - Information Tech</option>
                                            <option value="B.Sc IT">B.Sc - Information Technology</option>
                                            <option value="MCA">MCA - Master of Applications</option>
                                            <option value="MBA">MBA - Management</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="enrollmentDate" class="form-label fw-medium">Enrollment Date <span
                                            class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i
                                                class="fa-solid fa-calendar-days text-muted"></i></span>
                                        <input type="date" class="form-control" id="enrollmentDate" disabled>
                                    </div>
                                </div>
                            </div>

                            <!-- Email & Mobile (2 Columns) -->
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="email" class="form-label fw-medium">Email Address <span
                                            class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i
                                                class="fa-solid fa-envelope text-muted"></i></span>
                                        <input type="email" class="form-control" id="email"
                                            placeholder="student@example.com" disabled>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label for="mobile" class="form-label fw-medium">Mobile Number <span
                                            class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i
                                                class="fa-solid fa-phone text-muted"></i></span>
                                        <input type="tel" class="form-control" id="mobile"
                                            placeholder="10-digit mobile number" maxlength="10" disabled>
                                    </div>
                                </div>
                            </div>

                            <!-- City Field -->
                            <div class="mb-4">
                                <label for="city" class="form-label fw-medium">City <span
                                        class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i
                                            class="fa-solid fa-city text-muted"></i></span>
                                    <input type="text" class="form-control" id="city" placeholder="Enter city name"
                                        disabled>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="d-flex flex-wrap gap-2 justify-content-end pt-3 border-top">
                                <button type="button"
                                    class="btn btn-primary px-4 py-2 fw-semibold d-flex align-items-center gap-2"
                                    id="saveBtn" onclick="saveStudent()" disabled>
                                    <i class="fa-solid fa-floppy-disk"></i> Save
                                </button>
                                <button type="button"
                                    class="btn btn-warning px-4 py-2 fw-semibold text-dark d-flex align-items-center gap-2"
                                    id="updateBtn" onclick="updateStudent()" disabled>
                                    <i class="fa-solid fa-pen-to-square"></i> Update
                                </button>
                                <button type="button"
                                    class="btn btn-outline-secondary px-4 py-2 fw-semibold d-flex align-items-center gap-2"
                                    id="resetBtn" onclick="resetForm()">
                                    <i class="fa-solid fa-rotate-left"></i> Reset
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto py-3 bg-light border-top text-center">
        <div class="container">
            <span class="text-muted fs-7">
                Student Enrollment Management System | JsonPowerDB Micro Project
            </span>
        </div>
    </footer>

    <!-- jQuery CDN (Required for JPDB Helper calls / AJAX) -->
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jpdb-commons.js CDN -->
    <script src="https://login2explore.com/jpdb/resources/js/0.0.8/jpdb-commons.js"></script>
    <!-- Custom Application Script -->
</body>

</html>
